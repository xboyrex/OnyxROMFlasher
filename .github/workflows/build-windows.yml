name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Syntax check
        run: |
          python -m py_compile main.py launcher.py build_windows.py

      - name: Build Onyx ROM Flasher
        run: python build_windows.py

      - name: Verify build contents
        shell: pwsh
        run: |
          $exe = "dist/OnyxROMFlasher/OnyxROMFlasher.exe"
          if (!(Test-Path $exe)) { throw "EXE not found: $exe" }
          foreach ($f in @("adb.exe","fastboot.exe","payload-dumper-go.exe")) {
            $p = "dist/OnyxROMFlasher/bin/$f"
            if (!(Test-Path $p)) { throw "Bundled tool not found: $p" }
          }

      - name: Package portable folder
        shell: pwsh
        run: Compress-Archive -Path "dist/OnyxROMFlasher/*" -DestinationPath "dist/OnyxROMFlasher-Windows.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OnyxROMFlasher-Windows
          path: dist/OnyxROMFlasher-Windows.zip
          if-no-files-found: error
